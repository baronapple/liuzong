<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>预约</title>
<style>
  :root{
    --paper:#FBF7F1;
    --ink:#20242B;
    --ink-soft:#5B6068;
    --idle:#3F9142;
    --idle-bg:#E7F3E6;
    --full:#C24B3F;
    --brass:#B8874B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:#E7E2D8;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px 80px;
  }
  .app{width:100%;max-width:440px;}
  .back-link{display:inline-block;font-size:13px;color:var(--ink-soft);text-decoration:none;margin-bottom:14px;}

  .week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .week-nav button{
    background:var(--paper);border:none;border-radius:10px;
    width:38px;height:38px;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;
    box-shadow:0 4px 14px -8px rgba(0,0,0,.3);
  }
  .week-nav button:disabled{opacity:.35;}
  .week-label{font-size:14px;font-weight:700;color:var(--ink-soft);}

  .day-tabs{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
    -webkit-overflow-scrolling:touch;
  }
  .day-tab{
    flex:1 0 auto;min-width:52px;text-align:center;
    background:var(--paper);border-radius:14px;padding:10px 6px;cursor:pointer;
    border:2px solid transparent;
  }
  .day-tab .dow{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .day-tab .dom{font-size:18px;font-weight:800;margin-top:2px;}
  .day-tab.active{border-color:var(--ink);}
  .day-tab.today .dom{color:var(--brass);}
  .day-tab.past{opacity:.4;}
  .day-tab.closed-day{opacity:.5;}
  .day-tab.closed-day .dom{color:var(--full);}

  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin:0 4px 10px;flex-wrap:wrap;}
  .legend span::before{
    content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;
  }
  .legend .l-free::before{background:var(--idle-bg);border:1.5px solid var(--idle);}
  .legend .l-taken::before{background:#D9D6CE;}
  .legend .l-mine::before{background:var(--ink);}

  .my-line{font-size:12.5px;color:var(--ink);background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px;line-height:1.7;}
  .my-line b{color:var(--brass);}

  .slot-list{background:var(--paper);border-radius:20px;padding:12px;box-shadow:0 12px 30px -18px rgba(0,0,0,.3);}
  .hour-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .hour-row:last-child{margin-bottom:0;}
  .hour-label{width:34px;font-size:12px;font-weight:700;color:var(--ink-soft);flex-shrink:0;}
  .chip{
    flex:1;text-align:center;border-radius:12px;padding:13px 0;
    font-size:14.5px;font-weight:700;cursor:pointer;user-select:none;
    border:1.5px solid transparent;
    -webkit-tap-highlight-color:transparent;
  }
  .chip small{display:block;font-size:10.5px;font-weight:600;margin-top:2px;}
  .chip.free{background:var(--idle-bg);border-color:var(--idle);color:var(--idle);}
  .chip.free:active{background:#d3e8d2;}
  .chip.taken{background:#E4E1D9;color:#9A968B;cursor:not-allowed;}
  .chip.mine{background:var(--ink);color:#fff;}
  .chip.past{background:transparent;color:#B9B5AA;cursor:default;opacity:.55;}
  .chip.busy{opacity:.5;pointer-events:none;}

  .empty-note{text-align:center;color:var(--ink-soft);font-size:13px;padding:24px 10px;}

  .toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
    background:rgba(32,36,43,.92);color:#fff;font-size:14px;font-weight:600;
    padding:12px 20px;border-radius:999px;opacity:0;transition:all .25s ease;
    pointer-events:none;z-index:100;max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <a href="./index.html" class="back-link">← 返回状态页 Back</a>

  <div class="week-nav">
    <button id="prevWeek">‹</button>
    <div class="week-label" id="weekLabel"></div>
    <button id="nextWeek">›</button>
  </div>

  <div class="day-tabs" id="dayTabs"></div>

  <div class="legend">
    <span class="l-free">可预约 Free</span>
    <span class="l-taken">已被约 Taken</span>
    <span class="l-mine">我的预约 Mine</span>
  </div>

  <div class="my-line" id="myLine" style="display:none"></div>

  <div class="slot-list" id="slotList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // 换成你部署好的 Cloudflare Worker 地址（跟 index.html / owner.html 里的要一致）
  const API_BASE = 'https://barber-status-api.haircutliuzong.workers.dev';
  const OPEN_HOUR = 10, CLOSE_HOUR = 19;
  const SLOT_MINUTES = [0, 20, 40];
  const DOW_LABELS = ['周日','周一','周二','周三','周四','周五','周六'];

  let weekOffset = 0;
  let selectedDate = null;
  let closedWeekdays = [];
  let busy = false;

  /* ===== 本机存储：设备编号 + 我的预约 ===== */
  const memStore = {};
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return memStore[k] || null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ memStore[k] = v; } }

  function getDeviceId(){
    let id = lsGet('deviceId');
    if(!id){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
         : 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,12);
      lsSet('deviceId', id);
    }
    return id;
  }

  function getMine(){
    try{ return JSON.parse(lsGet('myBookings') || '[]'); }catch(e){ return []; }
  }
  function setMine(list){ lsSet('myBookings', JSON.stringify(list)); }
  function findMine(date, time){ return getMine().find(b => b.date === date && b.time === time); }
  function removeMine(id){ setMine(getMine().filter(b => b.id !== id)); }

  /* ===== 工具函数 ===== */
  function pad(n){ return String(n).padStart(2,'0'); }
  function toDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function todayStr(){ return toDateStr(new Date()); }
  function weekdayOf(dateStr){ return new Date(dateStr + 'T00:00:00').getDay(); }

  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function getWeekDates(offset){
    const now = new Date();
    const day = now.getDay();
    const mondayOffset = day === 0 ? -6 : 1 - day;
    const monday = new Date(now);
    monday.setDate(now.getDate() + mondayOffset + offset*7);
    monday.setHours(0,0,0,0);
    const dates = [];
    for(let i=0;i<7;i++){
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      dates.push(d);
    }
    return dates;
  }

  /* ===== 休息日 ===== */
  async function loadSchedule(){
    try{
      const res = await fetch(`${API_BASE}/schedule`);
      const json = await res.json();
      if(json.success) closedWeekdays = json.data.closedWeekdays || [];
    }catch(e){ closedWeekdays = []; }
  }

  /* ===== 渲染 ===== */
  function renderWeekNav(dates){
    const first = dates[0], last = dates[6];
    document.getElementById('weekLabel').textContent =
      `${first.getMonth()+1}月${first.getDate()}日 - ${last.getMonth()+1}月${last.getDate()}日`;
    document.getElementById('prevWeek').disabled = weekOffset <= 0;
  }

  function renderDayTabs(dates){
    const tabs = document.getElementById('dayTabs');
    tabs.innerHTML = '';
    const today = todayStr();
    dates.forEach(d => {
      const dateStr = toDateStr(d);
      const isPast = dateStr < today;
      const isToday = dateStr === today;
      const isClosedDay = closedWeekdays.includes(d.getDay());
      const el = document.createElement('div');
      el.className = 'day-tab' + (dateStr===selectedDate?' active':'') + (isToday?' today':'') + (isPast?' past':'') + (isClosedDay?' closed-day':'');
      el.innerHTML = `<div class="dow">${isClosedDay?'休':DOW_LABELS[d.getDay()]}</div><div class="dom">${d.getDate()}</div>`;
      el.addEventListener('click', () => { selectedDate = dateStr; renderDayTabs(dates); loadDaySlots(dateStr); });
      tabs.appendChild(el);
    });
  }

  function renderMyLine(){
    const el = document.getElementById('myLine');
    const today = todayStr();
    const upcoming = getMine().filter(b => b.date >= today)
      .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    if(upcoming.length === 0){ el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.innerHTML = '你的预约：' + upcoming.map(b => {
      const d = new Date(b.date + 'T00:00:00');
      return `<b>${d.getMonth()+1}/${d.getDate()} ${DOW_LABELS[d.getDay()]} ${b.time}</b>`;
    }).join('、');
  }

  async function loadDaySlots(dateStr){
    const list = document.getElementById('slotList');

    if(closedWeekdays.includes(weekdayOf(dateStr))){
      list.innerHTML = '<div class="empty-note">这一天不营业，换个日子看看吧</div>';
      renderMyLine();
      return;
    }

    try{
      const res = await fetch(`${API_BASE}/bookings?date=${dateStr}`);
      const json = await res.json();
      if(!json.success) throw new Error('bad');
      const taken = new Set(json.data.map(b => b.time));

      // 如果我本地记着的预约，服务器上已经没有了（比如老板取消了），就清掉
      getMine().filter(b => b.date === dateStr && !taken.has(b.time)).forEach(b => removeMine(b.id));

      renderSlotList(dateStr, taken);
      renderMyLine();
    }catch(e){
      list.innerHTML = '<div class="empty-note">加载失败，请刷新页面重试</div>';
    }
  }

  function renderSlotList(dateStr, taken){
    const list = document.getElementById('slotList');
    const today = todayStr();
    const now = new Date();
    const nowMinutes = now.getHours()*60 + now.getMinutes();

    list.innerHTML = '';
    for(let h = OPEN_HOUR; h < CLOSE_HOUR; h++){
      const row = document.createElement('div');
      row.className = 'hour-row';
      row.innerHTML = `<div class="hour-label">${h}点</div>`;

      SLOT_MINUTES.forEach(m => {
        const time = `${pad(h)}:${pad(m)}`;
        const isPast = dateStr < today || (dateStr === today && h*60+m <= nowMinutes);
        const mine = findMine(dateStr, time);
        const isTaken = taken.has(time);

        const chip = document.createElement('div');
        if(isPast){
          chip.className = 'chip past';
          chip.innerHTML = time;
        } else if(isTaken && mine){
          chip.className = 'chip mine';
          chip.innerHTML = `${time}<small>我的 · 点击取消</small>`;
          chip.addEventListener('click', () => cancelMine(dateStr, time, mine.id, chip));
        } else if(isTaken){
          chip.className = 'chip taken';
          chip.innerHTML = `${time}<small>已被约</small>`;
          chip.addEventListener('click', () => toast('这个时间已被预约'));
        } else {
          chip.className = 'chip free';
          chip.innerHTML = `${time}<small>点击预约</small>`;
          chip.addEventListener('click', () => bookSlot(dateStr, time, chip));
        }
        row.appendChild(chip);
      });
      list.appendChild(row);
    }
  }

  /* ===== 预约 / 取消（点一下预约，再点一下取消）===== */
  async function bookSlot(dateStr, time, chip){
    if(busy) return;
    busy = true; chip.classList.add('busy');
    try{
      const res = await fetch(`${API_BASE}/bookings`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ date: dateStr, time, deviceId: getDeviceId() })
      });
      const json = await res.json();
      if(json.success){
        setMine([...getMine(), { id: json.id, date: dateStr, time }]);
        toast(`已预约 ${time}`);
      } else if(json.error === 'SLOT_TAKEN'){
        toast('手慢了，刚被别人订走了');
      } else if(json.error === 'TOO_MANY_BOOKINGS'){
        toast(`最多同时预约 ${json.max || 3} 个时间，先取消一个吧`);
      } else if(json.error === 'DAY_CLOSED'){
        toast('这一天不营业');
      } else {
        toast('预约失败，请重试');
      }
    }catch(e){
      toast('网络错误，请重试');
    }
    busy = false;
    loadDaySlots(dateStr);
  }

  async function cancelMine(dateStr, time, id, chip){
    if(busy) return;
    if(!confirm(`取消 ${time} 的预约？`)) return;
    busy = true; chip.classList.add('busy');
    try{
      const res = await fetch(`${API_BASE}/bookings/cancel`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id })
      });
      const json = await res.json();
      if(json.success || json.error === 'NOT_FOUND'){
        removeMine(id);
        toast('已取消');
      } else {
        toast('取消失败，请重试');
      }
    }catch(e){
      toast('网络错误，请重试');
    }
    busy = false;
    loadDaySlots(dateStr);
  }

  /* ===== 初始化 & 翻周 ===== */
  function pickDefaultDate(dates){
    const today = todayStr();
    const open = dates.find(d => toDateStr(d) >= today && !closedWeekdays.includes(d.getDay()));
    return toDateStr(open || dates.find(d => toDateStr(d) >= today) || dates[0]);
  }

  function showWeek(){
    const dates = getWeekDates(weekOffset);
    renderWeekNav(dates);
    selectedDate = pickDefaultDate(dates);
    renderDayTabs(dates);
    loadDaySlots(selectedDate);
  }

  document.getElementById('prevWeek').addEventListener('click', () => { if(weekOffset > 0){ weekOffset -= 1; showWeek(); } });
  document.getElementById('nextWeek').addEventListener('click', () => { weekOffset += 1; showWeek(); });

  // 每 20 秒自动刷新当天空位，让大家看到的基本是最新的
  setInterval(() => { if(!busy && selectedDate) loadDaySlots(selectedDate); }, 20000);

  (async function init(){
    await loadSchedule();
    showWeek();
  })();
</script>
</body>
</html>
